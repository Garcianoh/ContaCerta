spring:
  application:
    name: contaCerta

  datasource:
    url: jdbc:postgresql://localhost:5432/contacerta
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    validate-migration-naming: true
    enabled: true
