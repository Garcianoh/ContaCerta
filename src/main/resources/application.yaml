spring:
  application:
    name: contaCerta

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/contacerta}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    validate-migration-naming: true
    enabled: true

  mail:
    host: smtp-relay.brevo.com
    port: 587
    username: ${BREVO_USERNAME}
    password: ${BREVO_PASSWORD} 
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          debug: true
        debug: true

jwt:
  secret: ${JWT_SECRET}